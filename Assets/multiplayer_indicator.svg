<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular con borde estilo Hollow Knight -->
  <circle cx="16" cy="16" r="14" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="2"/>
  
  <!-- Círculo interior con efecto de profundidad -->
  <circle cx="16" cy="16" r="10" fill="#2d2d2d" stroke="#666" stroke-width="1"/>
  
  <!-- Símbolo central - dos figuras conectadas representando cooperación -->
  <g transform="translate(16,16)">
    <!-- Figura 1 (izquierda) -->
    <circle cx="-3" cy="-2" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M -3,-2 L -3,2 M -5,0 L -1,0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Figura 2 (derecha) -->
    <circle cx="3" cy="-2" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M 3,-2 L 3,2 M 1,0 L 5,0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Línea de conexión entre las figuras -->
    <path d="M -1,1 Q 0,3 1,1" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Pequeños puntos decorativos estilo Hollow Knight -->
    <circle cx="-6" cy="-6" r="0.8" fill="currentColor" opacity="0.6"/>
    <circle cx="6" cy="-6" r="0.8" fill="currentColor" opacity="0.6"/>
    <circle cx="0" cy="6" r="0.8" fill="currentColor" opacity="0.6"/>
  </g>
  
  <!-- Efecto de brillo sutil en la parte superior -->
  <ellipse cx="16" cy="10" rx="8" ry="3" fill="url(#shine)" opacity="0.3"/>
  
  <!-- Definición del gradiente para el brillo -->
  <defs>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>